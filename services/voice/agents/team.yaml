# Agents this ClawVoice installation serves.
# Priority 2a serves Tari (personal assistant) and Astra (coding assistant).
# Fixture agents load only with CLAWVOICE_ENABLE_FIXTURES=1 (offline tests).
# Override at runtime with CLAWVOICE_AGENTS=a,b and CLAWVOICE_DEFAULT_AGENT=a.
default_agent: tari
agents: [tari, astra]
fixture_agents: [fixture]
