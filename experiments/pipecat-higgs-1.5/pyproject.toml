[project]
name = "clawvoice-pipecat-higgs-preview"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[runner,webrtc]==1.12.0",
  "pipecat-boson==0.1.4",
  "python-dotenv==1.2.2",
  "aiohttp==3.13.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.15.7"]

[tool.uv]
package = false
constraint-dependencies = ["nltk!=3.10.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
