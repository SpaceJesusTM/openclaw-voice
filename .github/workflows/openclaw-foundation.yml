name: OpenClaw foundation (offline)
on:
  push:
    branches:
      - feat/openclaw-google-foundation
    paths:
      - 'infra/openclaw/**'
      - '.github/workflows/openclaw-foundation.yml'
  workflow_dispatch:
jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline Python and configuration checks
        run: |
          python -m unittest discover -s infra/openclaw/tests -v
          python -m py_compile infra/openclaw/manage.py infra/openclaw/workspace/bin/tari-google
          python -m json.tool infra/openclaw/config/openclaw.json >/dev/null
      - name: Generate mock private installation (no credentials or calls)
        run: |
          python infra/openclaw/manage.py init --timezone UTC --name Demo
          test -f infra/openclaw/.local/state/openclaw.json
          test -f infra/openclaw/.local/state/workspace/bin/tari-google
      - name: Validate Docker Compose manifest
        run: |
          docker compose --project-directory infra/openclaw \
            --env-file infra/openclaw/.local/runtime.env \
            -f infra/openclaw/compose.yaml config --quiet
      - name: Ensure no private state tracked
        run: |
          if git ls-files | grep -E '(^|/)\.local/|(^|/)client_secret\.json$|(^|/)runtime\.env$'; then
            echo 'Private state appears in Git'; exit 1
          fi
